name: Watchdog

# 看门狗：检查「定时同步」是不是真的在被调度。
#
# 为什么需要它（2026-10-29 实测）：
#
#   GitHub 会在 fork 仓库上自动停用 Actions（省算力策略，见 docs/FORK.md §7.8）。
#   停用之后，**没有任何报错**：定时同步不再产生 run，仓库看起来一切正常，
#   只是每天的同步悄无声息地停了。上游那 7 天里就是这样断更的，而且
#   「同步停了」和「上游本来就没更新」在日志里长得一模一样。
#
#   这个看门狗用的是**另一条**定时线：如果 Actions 被整体停用，它自己也不会跑
#   （那正是它存在的意义 —— 它是那个「什么都不发生」的反证）。所以它能做的
#   是发现「sync-upstream 没跑但别的跑了」，以及在 Actions 恢复后立刻告诉你
#   断更了多久。
#
# 判定逻辑（只用公开的 run 列表，不需要任何 secret）：
#
#   1. 取 sync-upstream 最近一次 event=schedule 的 run；
#   2. 距离它超过 48 小时 → 报 issue（"定时同步已停摆"）；
#   3. 距离它超过 48 小时但 issue 已存在 → 不重复开，避免刷屏；
#   4. 一切正常 → 关掉之前开的 issue（如果还没关）。
#
# 手动触发：gh workflow run watchdog.yml --repo PriceNing/pi-web --ref main

on:
  schedule:
    # 每 6 小时查一次。48 小时的容忍度意味着一次误判不会误报，
    # 而真正的停摆（7 天那种）会被很快发现。
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查定时同步有没有在跑
        uses: actions/github-script@v7
        env:
          SYNC_WORKFLOW: "sync-upstream.yml"
          STALE_HOURS: "48"
          ISSUE_TITLE: "定时同步已停摆：sync-upstream.yml 超过 48 小时没有 schedule 运行"
        with:
          script: |
            const workflow = process.env.SYNC_WORKFLOW;
            const staleHours = Number(process.env.STALE_HOURS);
            const issueTitle = process.env.ISSUE_TITLE;

            const { owner, repo } = context.repo;

            // 直接按**文件名**列 run：GitHub 的 REST 接受 workflow 文件名，
            // 不必先查 workflow id（而且 getWorkflowByName 在 github-script v7 的
            // octokit 版本里并不存在，用了会直接 "is not a function"）。
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflow, per_page: 50,
            });

            const scheduled = runs.data.workflow_runs
              .filter((r) => r.event === "schedule")
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const latest = scheduled[scheduled.length - 1];
            const now = Date.now();

            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });
            const existing = issues.data.find((i) => i.title === issueTitle);

            if (!latest) {
              // 从来没被调度过：要么是刚建好的仓库，要么是被停用后还没恢复过。
              const anyRun = runs.data.workflow_runs[0];
              const ageHours = anyRun ? (now - new Date(anyRun.created_at)) / 3600000 : Infinity;
              if (ageHours > staleHours) {
                const body = [
                  `\`${workflow}\` 从来没有被定时调度过（仓库里最早的 run 已是 ${Math.round(ageHours)} 小时前）。`,
                  "",
                  "常见原因（本仓库是 fork）：GitHub 会自动停用 fork 上的 workflow 来省算力。",
                  "恢复方式：打开仓库的 **Actions 标签页**（不是 Settings → Actions），",
                  `点绿色按钮 "I understand my workflows, go ahead and re-enable them"。`,
                  "",
                  "详见 docs/FORK.md §7.8。",
                ].join("\n");
                if (existing) {
                  await github.rest.issues.update({
                    owner, repo, issue_number: existing.number, body,
                  });
                  core.info("已更新既有的停摆 issue");
                } else {
                  await github.rest.issues.create({ owner, repo, title: issueTitle, body });
                  core.info("已开 issue：定时同步从未被调度");
                }
              } else {
                core.info("还没有 schedule 运行，但仓库很新，先不报警");
              }
              return;
            }

            const ageHours = (now - new Date(latest.created_at)) / 3600000;
            const ageText = `${Math.round(ageHours)} 小时前`;

            if (ageHours > staleHours) {
              const body = [
                `\`${workflow}\` 最近一次定时运行是 ${ageText}（${latest.created_at}），`,
                `已经超过 ${staleHours} 小时没有新的 schedule 运行。`,
                "",
                "这说明定时同步**没有被调度**，而不是同步失败了。",
                "最常见的原因（本仓库是 fork）：GitHub 自动停用了 fork 上的 workflow。",
                "",
                "恢复方式：打开仓库的 **Actions 标签页**（不是 Settings → Actions），",
                `点绿色按钮 "I understand my workflows, go ahead and re-enable them"。`,
                "",
                "恢复后手动触发一次同步：",
                "```",
                "gh workflow run sync-upstream.yml --repo PriceNing/pi-web --ref main -f force_publish=true",
                "```",
                "",
                "详见 docs/FORK.md §7.8 与 §6.3。",
              ].join("\n");
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body,
                });
                core.info("已更新既有的停摆 issue");
              } else {
                await github.rest.issues.create({ owner, repo, title: issueTitle, body });
                core.info("已开 issue：定时同步停摆");
              }
              return;
            }

            // 正常。如果之前开过停摆的 issue，把它关掉。
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed",
              });
              core.info("定时同步恢复正常，已关闭之前的停摆 issue");
            } else {
              core.info(`定时同步正常：最近一次 schedule 运行在 ${ageText}`);
            }
