name: Watchdog

# 看门狗：检查「定时同步」是不是真的在被调度。
#
# 为什么需要它（2026-10-29 实测）：
#
#   GitHub 会在 fork 仓库上自动停用 Actions（省算力策略，见 docs/FORK.md §7.8）。
#   停用之后，**没有任何报错**：定时同步不再产生 run，仓库看起来一切正常，
#   只是每天的同步悄无声息地停了。上游那 7 天里就是这样断更的，而且
#   「同步停了」和「上游本来就没更新」在日志里长得一模一样。
#
# 这个 workflow 只做到「**发现并说清楚**」这一步：
#
#   - 发现停摆 → **本 run 失败**（GitHub 会给仓库管理员发邮件/通知），
#     并把原因写进 run 的 summary —— 谁打开 Actions 都能看见；
#   - 一切正常 → 成功，并在 summary 里写下最近一次 schedule 运行的时间。
#
# 为什么不用 issue 报告：**fork 仓库的 Issues 默认被禁用**（本仓库
# `has_issues: false`），Discussions 同样禁用，Projects 需要额外的 token
# scope。第一次实现就是撞在这上面失败的。所以这里只依赖两样一定存在的东西：
# **run 的失败状态**和**run 的 summary**。
#
#   另外还有一层不依赖 GitHub 的检测：scripts/check-sync-watchdog.mjs，
#   它只读公开的 run 列表（匿名 HTTP），可以在生产机上跑，Actions 全停时
#   依然有效。
#
# 手动触发：gh workflow run watchdog.yml --repo PriceNing/pi-web --ref main

on:
  schedule:
    # 每 6 小时查一次。48 小时的容忍度意味着一次误判不会误报，
    # 而真正的停摆（7 天那种）会被很快发现。
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查定时同步有没有在跑
        uses: actions/github-script@v7
        env:
          SYNC_WORKFLOW: "sync-upstream.yml"
          STALE_HOURS: "48"
        with:
          script: |
            const workflow = process.env.SYNC_WORKFLOW;
            const staleHours = Number(process.env.STALE_HOURS);

            const { owner, repo } = context.repo;

            // 直接按**文件名**列 run：GitHub 的 REST 接受 workflow 文件名，
            // 不必先查 workflow id（而且 getWorkflowByName 在 github-script v7 的
            // octokit 版本里并不存在，用了会直接 "is not a function"）。
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflow, per_page: 50,
            });

            const scheduled = runs.data.workflow_runs
              .filter((r) => r.event === "schedule" && typeof r.created_at === "string")
              .map((r) => ({ created_at: r.created_at, time: Date.parse(r.created_at) }))
              .filter((r) => Number.isFinite(r.time))
              .sort((a, b) => a.time - b.time);

            const latest = scheduled[scheduled.length - 1];
            const now = Date.now();

            // 判断分支和 scripts/check-sync-watchdog.mjs 保持一致：
            // 从来没被调度过 ≠ 停摆 —— 刚建好的仓库当然还没有 schedule 运行。
            // 所以要看「这个仓库最早的 run 也有多旧」。
            let stale = false;
            let ageHours = null;
            let reason = "";
            let lastScheduleAt = null;

            if (!latest) {
              const anyRun = runs.data.workflow_runs
                .map((r) => r.created_at)
                .filter((v) => typeof v === "string")
                .sort()
                .at(-1);
              const anyAge = anyRun ? (now - Date.parse(anyRun)) / 3600000 : Infinity;
              if (anyAge > staleHours) {
                stale = true;
                ageHours = anyAge;
                reason = "从来没有被定时调度过";
              } else {
                reason = `仓库还很新（最早的 run 才是 ${Math.round(anyAge)} 小时前），先不报警`;
              }
            } else {
              ageHours = (now - Date.parse(latest.created_at)) / 3600000;
              lastScheduleAt = latest.created_at;
              if (ageHours > staleHours) {
                stale = true;
                reason = "超过阈值没有新的 schedule 运行";
              }
            }

            const restoreHint = [
              "## 怎么恢复",
              "",
              "本仓库是 **fork**（父仓库 `agegr/pi-web`），GitHub 会自动停用 fork 上的",
              "workflow 来省算力 —— 被删掉/停用的 workflow **不报错**，只是不再被调度。",
              "",
              "打开仓库的 **Actions 标签页**（不是 Settings → Actions，那里没有开关）：",
              "",
              `https://github.com/${owner}/${repo}/actions`,
              "",
              '那里是一整页占位面板，点绿色按钮 **"I understand my workflows, go ahead and re-enable them"**。',
              "",
              "恢复后手动触发一次同步（会强制发版，用来确认整条链路真的活了）：",
              "",
              "```",
              `gh workflow run sync-upstream.yml --repo ${owner}/${repo} --ref main -f force_publish=true`,
              "```",
              "",
              "详见 `docs/FORK.md` §7.8（症状与恢复）与 §6.3（本地手工流程）。",
            ].join("\n");

            if (stale) {
              const summary = [
                "## ✗ 定时同步已停摆",
                "",
                `\`${workflow}\` 的最近一次 schedule 运行是 **${Math.round(ageHours)} 小时前**（阈值 ${staleHours} 小时）。`,
                reason,
                "",
                lastScheduleAt ? `最后一次 schedule 运行时间：\`${lastScheduleAt}\`` : "",
                "",
                "这说明定时同步**没有被调度**，而不是同步失败了 ——",
                "「同步停了」和「上游本来就没更新」在日志里长得一模一样，必须主动查。",
                "",
                restoreHint,
              ].filter((line) => line !== "").join("\n");
              await core.summary.addRaw(summary).write();
              core.setFailed(`定时同步已停摆：最近一次 schedule 运行是 ${Math.round(ageHours)} 小时前（阈值 ${staleHours} 小时）`);
              return;
            }

            const summary = [
              "## ✓ 定时同步正常",
              "",
              `最近一次 schedule 运行：${lastScheduleAt ?? "（还没有过）"}`,
              ageHours === null ? "" : `距今 ${Math.round(ageHours)} 小时（阈值 ${staleHours} 小时）。`,
              "",
              reason && !lastScheduleAt ? reason : "",
            ].filter((line) => line !== "").join("\n");
            await core.summary.addRaw(summary).write();
            core.info(`定时同步正常：最近一次 schedule 运行在 ${Math.round(ageHours ?? 0)} 小时前`);
