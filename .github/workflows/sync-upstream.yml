# [pin-fork] 上游同步 + fork 发版
#
# 设计约束（详见 docs/FORK.md）：
#   - main = 上游 + 本 fork 的补丁；同步方式是 merge upstream/main，不是 rebase。
#   - 任何一步失败都不推送、不发版，避免生产机装到半成品。
#   - 版本必须是纯 x.y.z（上游的更新检查只认这个格式），规则见 scripts/next-version.mjs。
#   - 灰度放在安装层（生产机锁精确版本 + 先升一台 canary），不依赖 registry dist-tag，
#     原因见下面"发布到 npm"步骤里的两条实测结论。

name: Sync upstream & publish fork

on:
  schedule:
    - cron: "30 6 * * *" # UTC 06:30 ≈ 北京 14:30
  workflow_dispatch:
    inputs:
      force_publish:
        description: "上游无新提交时也强制走一次发布"
        type: boolean
        default: false

permissions:
  contents: write # 推送 main 与创建 Release
  id-token: write # npm Trusted Publishing (OIDC)
# 注意：GITHUB_TOKEN 无法改动 .github/workflows/ 下的文件，而且
# \`workflows\` 不是合法的 workflow permissions 键（写了会导致 workflow 解析失败）。
# 上游同步迟早会带进 ci.yml 的改动，所以推送这一步支持用 GIT_PUSH_TOKEN(PAT) 兜底。

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    # 只允许在 main 上跑：这个 workflow 会推送 main 并发布正式包。
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      PKG: "@pricening/pi-web"
      REGISTRY: "https://registry.npmjs.org/"
      UPSTREAM: "https://github.com/agegr/pi-web.git"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史与 tag 才能算版本、打 Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0 # 与 package.json engines 一致
          cache: npm

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游
        run: |
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch upstream --tags --prune

      - name: 合并上游（冲突即停，不发布）
        id: merge
        run: |
          incoming=$(git rev-list --count HEAD..upstream/main)
          echo "incoming=$incoming" >> "$GITHUB_OUTPUT"
          if [ "$incoming" = "0" ]; then
            echo "上游无新提交"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            conflicted=$(git diff --name-only "$(git merge-base HEAD upstream/main)" upstream/main | tr '\n' ' ')
            echo "::error title=上游合并冲突::与 upstream/main 冲突，可能涉及：$conflicted 。请本地执行： git fetch upstream && git merge upstream/main 手工解决后推送。本次不发版。"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁（lint / 类型 / 全量测试）
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
        # npm test 会跑 lib/pin-fork-anchors.test.mjs：上游若重构掉 pin 的接缝，
        # 这里会红，从而不会发出一个"pin 已静默失效"的版本。

      - name: 计算版本号
        id: version
        run: |
          # 新包刚发布时，registry 的 packument 路由（npm view 走的就是它）可能仍返回
          # 404，而 dist-tags 路由已经可用。只看 npm view 会把"已经发过版"误判成
          # "从未发过版"，下次就会算出重复版本号并撞上 E409。所以两个来源都取，拿最大值。
          published=$( { npm view "$PKG" version --registry "$REGISTRY" 2>/dev/null || true
                        npm dist-tag ls "$PKG" --registry "$REGISTRY" 2>/dev/null \
                          | awk -F': ' '/^[A-Za-z0-9_-]+: /{print $2}' || true
                      } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 )
          published=${published:-0.0.0}
          next=$(node scripts/next-version.mjs --published "$published")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.merge.outputs.incoming }}" = "0" ] \
             && [ "$next" = "$published" ] \
             && [ "${{ inputs.force_publish }}" != "true" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建
        if: steps.version.outputs.skip != '1'
        run: |
          npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: 发布到 npm
        if: steps.version.outputs.skip != '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 直接发 latest，不用 `--tag next`。两条实测结论决定了这一点：
          #   1) 首次发布时即使加 --tag next，npm 仍会创建 latest，"next 灰度"形同虚设；
          #   2) 把 latest 改回去需要能改 dist-tag 的凭据——普通 token 被账号 2FA 策略
          #      挡掉（实测 403），而 Trusted Publishing (OIDC) 只能发布、不能改 tag。
          # 灰度因此放在安装层：见 docs/FORK.md §7（生产机锁版本 + 先升一台 canary）。
          # 发布通道：OIDC 优先（无 secret、无过期，也是 2027-01 token 禁令之后唯一可行的
          # 路径），失败才退回 NPM_TOKEN 兜底。这样每次发布都在顺手验证 OIDC 是否配好，
          # 同时不牺牲退路。
          set +e
          echo "::group::尝试 Trusted Publishing (OIDC)"
          npm publish --provenance
          oidc_status=$?
          echo "::endgroup::"
          if [ "$oidc_status" = "0" ]; then
            echo "✅ OIDC 发布成功：Trusted Publishing 已生效，本次发布没有用到任何 secret"
            exit 0
          fi
          echo "::warning title=OIDC 发布未通过::npm publish --provenance 退出码 ${oidc_status}；下面尝试 NPM_TOKEN 兜底"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error title=没有可用发布通道::OIDC 失败且未配置 NPM_TOKEN。请到 npm 包页面核对 Trusted Publishing：Organization or user=PriceNing、Repository=pi-web、Branch=main、Workflow filename=sync-upstream.yml，并且必须勾选 Allow npm publish"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          echo "↩︎ 使用 NPM_TOKEN 兜底发布（绕过 2FA 的 granular token 于 2027-01 失效，届时只能靠 OIDC）"
          npm publish

      - name: 打包 tarball 作为 Release 附件（内网/镜像拉不到 npm 时的兜底）
        if: steps.version.outputs.skip != '1'
        id: pack
        run: |
          # npm pack 不会创建 --pack-destination 目录，必须自己 mkdir。
          mkdir -p ./dist-pack
          npm pack --pack-destination ./dist-pack
          tarball=$(ls dist-pack/*.tgz | head -1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - name: 提交合并结果并打 tag
        if: steps.version.outputs.skip != '1'
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GIT_PUSH_TOKEN }}
        run: |
          version="${{ steps.version.outputs.next }}"
          # 只提交版本号：dist-pack/ 里是刚打的 tarball，绝不能进仓库。
          git add package.json
          git diff --cached --quiet || git commit -m "chore(release): v${version}"
          git tag -f "v${version}"
          # 不要用 --follow-tags：它会顺着 main 的历史把上游的几十个 tag 一起推到 fork，
          # 其中指向"新增 workflow 文件"的 tag 会被 GitHub 拒收，整步失败。
          # 只推我们自己的发布 tag。
          push_url="origin"
          if [ -n "${GIT_PUSH_TOKEN:-}" ]; then
            # 带 PAT 时用 https+token 直推，这样即使本次合并改到了
            # .github/workflows/ 里的文件（GITHUB_TOKEN 不允许）也不会卡住。
            git remote set-url origin               "https://x-access-token:${GIT_PUSH_TOKEN}@github.com/PriceNing/pi-web.git"
            echo "使用 GIT_PUSH_TOKEN(PAT) 推送"
          fi
          if ! git push "$push_url" "HEAD:refs/heads/main"; then
            echo "::error title=推送 main 失败::多半是本次合并改到了 .github/workflows/ 下的文件（GITHUB_TOKEN 无权修改）。两种解法：(1) 在仓库 secrets 里加 GIT_PUSH_TOKEN（fine-grained PAT，contents:Read&Write）；(2) 本地 git push origin main。本次 npm 包已发布成功，只是 git 侧未同步。"
            exit 1
          fi
          git push "$push_url" "refs/tags/v${version}:refs/tags/v${version}" --force

      - name: 创建 GitHub Release（附 tarball）
        if: steps.version.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.next }}"
          pkg_name="${{ steps.pack.outputs.pkg_name }}"
          base=$(node -p "require('./package.json').forkedFrom.version")
          notes=$(git log --pretty=format:'- %s' -20 "v${version}" | head -40)
          {
            echo "上游基线：v${base}"
            echo
            echo "## 安装"
            echo '```'
            echo "npm i -g ${PKG}@${version} --registry=${REGISTRY}"
            echo '```'
            echo
            echo "离线兜底：下载本页附件 \`${pkg_name}\`，执行 \`npm i -g ./${pkg_name}\`"
            echo
            echo "## 升级策略"
            echo "先升一台 canary 验证，再改部署脚本里的 PINNED_VERSION（生产机锁精确版本）。"
            echo
            echo "## 本版本包含的提交"
            echo "${notes}"
          } > release-notes.md
          gh release create "v${version}" --title "v${version}" --notes-file release-notes.md \
            "${{ steps.pack.outputs.tarball }}"

      - name: 结果摘要
        run: |
          {
            echo "## Fork 同步结果"
            echo "- 上游新提交：${{ steps.merge.outputs.incoming }}"
            echo "- 已发布最高版本：${{ steps.version.outputs.published }}"
            echo "- 本次版本：${{ steps.version.outputs.next }}"
            echo "- 跳过发布：${{ steps.version.outputs.skip || '0' }}"
            echo "- 升级方式：先升一台 canary（\`npm i -g ${PKG}@${{ steps.version.outputs.next }}\`），验证后再改部署脚本里的 PINNED_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
