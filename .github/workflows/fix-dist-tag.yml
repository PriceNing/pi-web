name: Fix npm dist-tag

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm install -g npm@11
      - name: 用 OIDC 改 dist-tag
        run: |
          # 不用 setup-node 的 registry-url：它会往 .npmrc 写一个占位的
          # NODE_AUTH_TOKEN，把 npm 自己的 OIDC 流程盖掉。
          rm -f ~/.npmrc
          npm dist-tag add @pricening/pi-web@0.12.4 next --registry=https://registry.npmjs.org/
          npm dist-tag ls @pricening/pi-web --registry=https://registry.npmjs.org/
